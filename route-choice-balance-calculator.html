  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

      const byId = id =&gt; root.querySelector(&#x27;#&#x27; + id);
      const enemyOrder = [&#x27;circle&#x27;, &#x27;triangle&#x27;, &#x27;charger&#x27;, &#x27;shooter&#x27;];
      const statOrder = [&#x27;size&#x27;, &#x27;speed&#x27;, &#x27;health&#x27;, &#x27;burst&#x27;];
      const enemies = {
        circle:   { hp: 3, speed: 3, size: 10, burst: 2, reward: 2, attack: &#x27;contact&#x27; },
        triangle: { hp: 1, speed: 5, size: 4,  burst: 5, reward: 1, attack: &#x27;contact&#x27; },
        charger:  { hp: 2, speed: 5, size: 4,  burst: 4, reward: 2, attack: &#x27;charger&#x27; },
        shooter:  { hp: 1, speed: 4, size: 4,  burst: 1, reward: 3, attack: &#x27;shooter&#x27; }
      };
      const weapons = {
        standard: { cadence: 1 / 3, scale: 1, damage: 1, kind: &#x27;primary&#x27; },
        railgun: { cadence: 1, scale: 6, damage: 2, kind: &#x27;primary&#x27;, accuracy: 0.9 },
        boomerang: { cadence: 0.8, scale: 2, damage: 1, kind: &#x27;primary&#x27;, returnFactor: 1.55 },
        bomb: { cadence: 3, scale: 4, damage: 2, kind: &#x27;secondary&#x27;, explosive: true },
        contact_bomb: { cadence: 3, scale: 4, damage: 2, kind: &#x27;secondary&#x27;, explosive: true },
        homing_rocket: { cadence: 2.5, scale: 3.5, damage: 2, kind: &#x27;secondary&#x27;, explosive: true, homing: true },
        auto_rocket: { cadence: 1.5, scale: 2, damage: 2, kind: &#x27;auto&#x27;, explosive: true, homing: true }
      };
      const phaseNames = [&#x27;Early&#x27;, &#x27;Mid&#x27;, &#x27;Late&#x27;];
      let seedCounter = 918273;

      function value(id) {
        const element = byId(id);
        return element.type === &#x27;checkbox&#x27; ? element.checked :
          element.tagName === &#x27;SELECT&#x27; ? element.value : Number(element.value);
      }

      function config() {
        return {
          arenaPoison: value(&#x27;rbl-arena-poison&#x27;),
          interiorEnemy: value(&#x27;rbl-interior-enemy&#x27;),
          spendStrategy: value(&#x27;rbl-spend-strategy&#x27;),
          samples: value(&#x27;rbl-samples&#x27;),
          globalPoison: value(&#x27;rbl-global-poison&#x27;),
          iframeCap: value(&#x27;rbl-iframe-cap&#x27;),
          shopPrice: value(&#x27;rbl-shop-price&#x27;),
          spendEfficiency: value(&#x27;rbl-spend-efficiency&#x27;) / 100,
          hardChance: value(&#x27;rbl-hard-chance&#x27;) / 100,
          waves: value(&#x27;rbl-waves&#x27;),
          horizon: value(&#x27;rbl-horizon&#x27;),
          riskWeight: value(&#x27;rbl-risk-weight&#x27;) / 100,
          deathCost: value(&#x27;rbl-death-cost&#x27;),
          interiorDamage: value(&#x27;rbl-interior-damage&#x27;),
          fuzz: value(&#x27;rbl-fuzz&#x27;) / 100,
          enemyMeans: [
            value(&#x27;rbl-early-enemy&#x27;), value(&#x27;rbl-mid-enemy&#x27;), value(&#x27;rbl-late-enemy&#x27;)
          ],
          playerMeans: [
            value(&#x27;rbl-early-player&#x27;), value(&#x27;rbl-mid-player&#x27;), value(&#x27;rbl-late-player&#x27;)
          ],
          internalMeans: [
            value(&#x27;rbl-early-internals&#x27;), value(&#x27;rbl-mid-internals&#x27;), value(&#x27;rbl-late-internals&#x27;)
          ],
          contactRate: value(&#x27;rbl-contact-rate&#x27;),
          chargerAccuracy: value(&#x27;rbl-charger-accuracy&#x27;) / 100,
          shooterAccuracy: value(&#x27;rbl-shooter-accuracy&#x27;) / 100,
          burstUtil: value(&#x27;rbl-burst-util&#x27;) / 100,
          aim: value(&#x27;rbl-aim&#x27;) / 100,
          explosion: value(&#x27;rbl-explosion&#x27;),
          bursts: value(&#x27;rbl-bursts&#x27;),
          uptime: value(&#x27;rbl-uptime&#x27;) / 100,
          exposure: value(&#x27;rbl-exposure&#x27;) / 100
        };
      }

      function rngFactory(seed) {
        let state = seed &gt;&gt;&gt; 0;
        return () =&gt; {
          state += 0x6D2B79F5;
          let t = state;
          t = Math.imul(t ^ (t &gt;&gt;&gt; 15), t | 1);
          t ^= t + Math.imul(t ^ (t &gt;&gt;&gt; 7), t | 61);
          return ((t ^ (t &gt;&gt;&gt; 14)) &gt;&gt;&gt; 0) / 4294967296;
        };
      }

      function randomInt(rng, max) {
        return Math.floor(rng() * Math.max(1, max));
      }

      function fuzzedCount(rng, mean, fuzz, max) {
        const radius = Math.ceil(mean * fuzz);
        return Math.max(0, Math.min(max,
          Math.round(mean + (rng() * 2 - 1) * radius)));
      }

      function blankStages() {
        const result = {};
        enemyOrder.forEach(enemy =&gt; {
          result[enemy] = { size: 0, speed: 0, health: 0, burst: 0 };
        });
        return result;
      }

      function cloneStages(source) {
        const result = {};
        enemyOrder.forEach(enemy =&gt; {
          result[enemy] = { ...source[enemy] };
        });
        return result;
      }

      function generateStages(rng, total, phaseIndex) {
        const stages = blankStages();
        for (let i = 0; i &lt; total; i++) {
          const stat = statOrder[randomInt(rng, statOrder.length)];
          enemyOrder.forEach(enemy =&gt; stages[enemy][stat]++);
        }
        const priorInteriorMean = [0, 1, 2][phaseIndex];
        const resets = fuzzedCount(rng, priorInteriorMean, 0.75, 5);
        for (let i = 0; i &lt; resets; i++) {
          const enemy = enemyOrder[randomInt(rng, enemyOrder.length)];
          statOrder.forEach(stat =&gt; stages[enemy][stat] = 0);
        }
        return stages;
      }

      function blankUpgrades() {
        return { hp: 0, move: 0, fire: 0, damage: 0, bomb: 0, inv: 0 };
      }

      function generateUpgrades(rng, total) {
        const upgrades = blankUpgrades();
        const keys = Object.keys(upgrades);
        for (let i = 0; i &lt; total; i++) upgrades[keys[randomInt(rng, keys.length)]]++;
        return upgrades;
      }

      function generateInternals(rng, total) {
        const internals = new Array(8).fill(false);
        const choices = [0, 1, 2, 3, 4, 5, 6, 7];
        for (let i = choices.length - 1; i &gt; 0; i--) {
          const j = randomInt(rng, i + 1);
          [choices[i], choices[j]] = [choices[j], choices[i]];
        }
        choices.slice(0, Math.min(8, total)).forEach(index =&gt; internals[index] = true);
        return internals;
      }

      function chooseLoadout(rng, phaseIndex) {
        const primaryRoll = rng();
        const secondaryRoll = rng();
        const primary = phaseIndex === 0
          ? (primaryRoll &lt; 0.8 ? &#x27;standard&#x27; : primaryRoll &lt; 0.9 ? &#x27;boomerang&#x27; : &#x27;railgun&#x27;)
          : phaseIndex === 1
            ? (primaryRoll &lt; 0.48 ? &#x27;standard&#x27; : primaryRoll &lt; 0.74 ? &#x27;boomerang&#x27; : &#x27;railgun&#x27;)
            : (primaryRoll &lt; 0.3 ? &#x27;standard&#x27; : primaryRoll &lt; 0.62 ? &#x27;boomerang&#x27; : &#x27;railgun&#x27;);
        const secondary = phaseIndex === 0
          ? (secondaryRoll &lt; 0.82 ? &#x27;bomb&#x27; : secondaryRoll &lt; 0.91 ? &#x27;contact_bomb&#x27; : &#x27;homing_rocket&#x27;)
          : phaseIndex === 1
            ? (secondaryRoll &lt; 0.55 ? &#x27;bomb&#x27; : secondaryRoll &lt; 0.75 ? &#x27;contact_bomb&#x27; : &#x27;homing_rocket&#x27;)
            : (secondaryRoll &lt; 0.38 ? &#x27;bomb&#x27; : secondaryRoll &lt; 0.62 ? &#x27;contact_bomb&#x27; : &#x27;homing_rocket&#x27;);
        return { primary, secondary };
      }

      function weaponDps(id, upgrades, internals, cfg) {
        const base = weapons[id];
        let cadence = Math.max(0.05,
          base.cadence - 0.0125 * base.scale * upgrades.fire);
        if (base.kind === &#x27;secondary&#x27;) {
          cadence = Math.max(0.05,
            cadence - 0.2 * base.scale * upgrades.bomb);
        }
        if (id === &#x27;auto_rocket&#x27; &amp;&amp; internals[3]) cadence = 1;
        const damage = base.damage + upgrades.damage;
        let count = 1;
        if (internals[1]) count += 1;
        if (internals[7]) count += 1;
        const projectiles = internals[6] ? 2 : 1;
        let efficiency = cfg.aim;
        if (base.homing || internals[2]) efficiency = Math.min(1, efficiency + 0.2);
        if (base.accuracy) efficiency *= base.accuracy;
        if (base.returnFactor) efficiency *= base.returnFactor;
        if (base.explosive) efficiency *= cfg.explosion;
        return damage * count * projectiles * efficiency / cadence;
      }

      function playerMetrics(upgrades, internals, loadout, cfg) {
        let primary;
        if (internals[4]) {
          primary = weaponDps(&#x27;standard&#x27;, upgrades, internals, cfg) +
            weaponDps(&#x27;boomerang&#x27;, upgrades, internals, cfg) +
            weaponDps(&#x27;railgun&#x27;, upgrades, internals, cfg);
        } else {
          primary = weaponDps(loadout.primary, upgrades, internals, cfg);
        }
        let secondary;
        if (internals[5]) {
          secondary = weaponDps(&#x27;bomb&#x27;, upgrades, internals, cfg) +
            weaponDps(&#x27;contact_bomb&#x27;, upgrades, internals, cfg) +
            weaponDps(&#x27;homing_rocket&#x27;, upgrades, internals, cfg);
        } else {
          secondary = weaponDps(loadout.secondary, upgrades, internals, cfg);
        }
        const auto = internals[3] ? weaponDps(&#x27;auto_rocket&#x27;, upgrades, internals, cfg) : 0;
        const hp = 3 + upgrades.hp;
        const moveFactor = 1 + upgrades.move * 0.025;
        const invincibility = Math.min(5, 0.5 + upgrades.inv * 0.1);
        const invFactor = 1 + upgrades.inv * 0.04;
        const regenFactor = internals[0] ? 1.18 : 1;
        return {
          hp,
          effectiveHp: hp * moveFactor * invFactor * regenFactor,
          invincibility,
          dps: primary + secondary + auto
        };
      }

      function enemyMetrics(stages, player, cfg) {
        let hp = 0;
        let rawDps = 0;
        enemyOrder.forEach(id =&gt; {
          const base = enemies[id];
          const stage = stages[id];
          const enemyHp = base.hp + stage.health;
          const speedRatio = (base.speed + stage.speed) / base.speed;
          const sizeRatio = (base.size + stage.size) / base.size;
          const burst = base.burst + stage.burst;
          let attack;
          if (base.attack === &#x27;contact&#x27;) {
            attack = cfg.contactRate *
              Math.pow(speedRatio, 0.9) * Math.pow(sizeRatio, 0.65);
          } else if (base.attack === &#x27;charger&#x27;) {
            attack = cfg.chargerAccuracy / (0.5 + 375 / 600 + 1) *
              Math.pow(speedRatio, 0.35) * Math.pow(sizeRatio, 0.4);
          } else {
            attack = cfg.shooterAccuracy / (1 + 1.5) *
              Math.pow(speedRatio, 0.15);
          }
          hp += enemyHp;
          rawDps += attack * burst * cfg.burstUtil;
        });
        hp /= enemyOrder.length;
        rawDps /= enemyOrder.length;
        const dps = cfg.iframeCap
          ? Math.min(rawDps, 1 / Math.max(0.05, player.invincibility))
          : rawDps;
        return { hp, dps, rawDps };
      }

      function combatIndex(player, enemy) {
        return (player.dps * player.effectiveHp) /
          Math.max(0.0001, enemy.hp * enemy.dps);
      }

      function addArenaPoison(stages, arenaEnemy, cfg, rng) {
        const result = cloneStages(stages);
        const stat = cfg.arenaPoison === &#x27;random&#x27;
          ? statOrder[randomInt(rng, statOrder.length)] : cfg.arenaPoison;
        const targets = cfg.globalPoison ? enemyOrder : [arenaEnemy];
        targets.forEach(enemy =&gt; result[enemy][stat]++);
        return result;
      }

      function resetInteriorEnemy(stages, targetEnemy) {
        const result = cloneStages(stages);
        statOrder.forEach(stat =&gt; result[targetEnemy][stat] = 0);
        return result;
      }

      function arenaComposition(rng, arenaEnemy, hard, waves) {
        const spawners = [];
        let spawnerHp = 0;
        for (let wave = 0; wave &lt; waves; wave++) {
          const count = Math.max(2, 1 + wave) + (hard ? 1 : 0);
          for (let i = 0; i &lt; count; i++) {
            let type = arenaEnemy;
            if (i &gt; 0) {
              const alternatives = enemyOrder.filter(id =&gt; id !== arenaEnemy);
              type = alternatives[randomInt(rng, alternatives.length)];
            }
            spawners.push(type);
            spawnerHp += 3 + wave;
          }
        }
        const coins = spawners.reduce((sum, id) =&gt; sum + enemies[id].reward, 0);
        return { spawners, spawnerHp, coins };
      }

      function upgradeGain(rng, upgrades, count, strategy, before, internals, loadout, cfg) {
        const result = { ...upgrades };
        const keys = [&#x27;hp&#x27;, &#x27;move&#x27;, &#x27;fire&#x27;, &#x27;damage&#x27;, &#x27;bomb&#x27;, &#x27;inv&#x27;];
        for (let purchase = 0; purchase &lt; count; purchase++) {
          let key;
          if (strategy === &#x27;random&#x27;) {
            key = keys[randomInt(rng, keys.length)];
          } else if (strategy === &#x27;damage&#x27;) {
            key = rng() &lt; 0.62 ? &#x27;damage&#x27; : rng() &lt; 0.7 ? &#x27;fire&#x27; : &#x27;bomb&#x27;;
          } else if (strategy === &#x27;survival&#x27;) {
            key = rng() &lt; 0.5 ? &#x27;hp&#x27; : rng() &lt; 0.7 ? &#x27;inv&#x27; : &#x27;move&#x27;;
          } else {
            let bestScore = -Infinity;
            keys.forEach(candidate =&gt; {
              const test = { ...result };
              test[candidate]++;
              const metrics = playerMetrics(test, internals, loadout, cfg);
              const score = (metrics.dps / before.dps) *
                (metrics.effectiveHp / before.effectiveHp);
              if (score &gt; bestScore) {
                bestScore = score;
                key = candidate;
              }
            });
          }
          result[key]++;
        }
        return result;
      }

      function arenaDamage(composition, stages, player, cfg) {
        const perSpawnerEnemyHp = composition.spawners.reduce((sum, id) =&gt; {
          const base = enemies[id];
          const stage = stages[id];
          const burst = base.burst + stage.burst;
          return sum + cfg.bursts * burst * (base.hp + stage.health);
        }, 0);
        const clearTime = (composition.spawnerHp + perSpawnerEnemyHp) /
          Math.max(0.1, player.dps * cfg.uptime);
        const averageConcurrentSpawners =
          Math.max(1, composition.spawners.length / cfg.waves * 0.7);
        const pressure = enemyMetrics(stages, player, cfg).dps *
          averageConcurrentSpawners;
        return pressure * clearTime * cfg.exposure;
      }

      function survivalChance(expectedDamage, hp) {
        const maximumHits = Math.max(0, Math.ceil(hp) - 1);
        let term = Math.exp(-Math.max(0, expectedDamage));
        let cumulative = term;
        for (let hits = 1; hits &lt;= maximumHits; hits++) {
          term *= expectedDamage / hits;
          cumulative += term;
        }
        return Math.max(0, Math.min(1, cumulative));
      }

      function quantile(sorted, q) {
        if (!sorted.length) return 0;
        const index = (sorted.length - 1) * q;
        const lower = Math.floor(index);
        const fraction = index - lower;
        return sorted[lower] * (1 - fraction) +
          sorted[Math.min(sorted.length - 1, lower + 1)] * fraction;
      }

      function summarize(samples) {
        const fields = [&#x27;ev&#x27;, &#x27;enemyHp&#x27;, &#x27;enemyDps&#x27;, &#x27;playerHp&#x27;, &#x27;playerDps&#x27;,
          &#x27;coins&#x27;, &#x27;damage&#x27;, &#x27;survival&#x27;, &#x27;enemyHpDelta&#x27;, &#x27;enemyDpsDelta&#x27;,
          &#x27;playerHpDelta&#x27;, &#x27;playerDpsDelta&#x27;, &#x27;marginDelta&#x27;];
        const result = {};
        fields.forEach(field =&gt; {
          const values = samples.map(sample =&gt; sample[field]).sort((a, b) =&gt; a - b);
          result[field] = values.reduce((sum, current) =&gt; sum + current, 0) /
            Math.max(1, values.length);
          result[field + &#x27;P10&#x27;] = quantile(values, 0.1);
          result[field + &#x27;P90&#x27;] = quantile(values, 0.9);
        });
        return result;
      }

      function simulatePhase(phaseIndex, cfg, seed) {
        const rng = rngFactory(seed);
        const arenaSamples = [];
        const interiorSamples = [];
        for (let sample = 0; sample &lt; cfg.samples; sample++) {
          const enemyTotal = fuzzedCount(rng, cfg.enemyMeans[phaseIndex], cfg.fuzz, 40);
          const playerTotal = fuzzedCount(rng, cfg.playerMeans[phaseIndex], cfg.fuzz, 40);
          const internalTotal = fuzzedCount(rng, cfg.internalMeans[phaseIndex], cfg.fuzz, 8);
          const stages = generateStages(rng, enemyTotal, phaseIndex);
          const upgrades = generateUpgrades(rng, playerTotal);
          const internals = generateInternals(rng, internalTotal);
          const loadout = chooseLoadout(rng, phaseIndex);
          const basePlayer = playerMetrics(upgrades, internals, loadout, cfg);
          const baseEnemy = enemyMetrics(stages, basePlayer, cfg);
          const baseIndex = combatIndex(basePlayer, baseEnemy);
          const arenaEnemy = enemyOrder[randomInt(rng, enemyOrder.length)];
          const hard = rng() &lt; cfg.hardChance;
          const composition = arenaComposition(rng, arenaEnemy, hard, cfg.waves);
          const arenaStages = addArenaPoison(stages, arenaEnemy, cfg, rng);
          const purchaseFloat = composition.coins / cfg.shopPrice * cfg.spendEfficiency;
          let purchases = Math.floor(purchaseFloat);
          if (rng() &lt; purchaseFloat - purchases) purchases++;
          const arenaUpgrades = upgradeGain(
            rng, upgrades, purchases, cfg.spendStrategy,
            basePlayer, internals, loadout, cfg);
          const arenaPlayer = playerMetrics(arenaUpgrades, internals, loadout, cfg);
          const arenaEnemyMetrics = enemyMetrics(arenaStages, arenaPlayer, cfg);
          const arenaMargin = (combatIndex(arenaPlayer, arenaEnemyMetrics) /
            baseIndex - 1) * 100;
          const damage = arenaDamage(
            composition, arenaStages, basePlayer, cfg);
          const arenaSurvival = survivalChance(damage, basePlayer.hp);
          const arenaEv = arenaMargin * cfg.horizon * arenaSurvival -
            cfg.deathCost * (1 - arenaSurvival) -
            damage / Math.max(1, basePlayer.hp) * 100 * cfg.riskWeight;
          arenaSamples.push({
            ev: arenaEv,
            enemyHp: arenaEnemyMetrics.hp,
            enemyDps: arenaEnemyMetrics.dps,
            playerHp: arenaPlayer.hp,
            playerDps: arenaPlayer.dps,
            coins: composition.coins,
            damage,
            survival: arenaSurvival,
            enemyHpDelta: (arenaEnemyMetrics.hp / baseEnemy.hp - 1) * 100,
            enemyDpsDelta: (arenaEnemyMetrics.dps / baseEnemy.dps - 1) * 100,
            playerHpDelta: (arenaPlayer.hp / basePlayer.hp - 1) * 100,
            playerDpsDelta: (arenaPlayer.dps / basePlayer.dps - 1) * 100,
            marginDelta: arenaMargin
          });

          const targetEnemy = cfg.interiorEnemy === &#x27;random&#x27;
            ? enemyOrder[randomInt(rng, enemyOrder.length)] : cfg.interiorEnemy;
          const interiorStages = resetInteriorEnemy(stages, targetEnemy);
          const interiorEnemyMetrics = enemyMetrics(
            interiorStages, basePlayer, cfg);
          const interiorMargin = (combatIndex(basePlayer, interiorEnemyMetrics) /
            baseIndex - 1) * 100;
          const interiorSurvival = survivalChance(
            cfg.interiorDamage, basePlayer.hp);
          const interiorEv = interiorMargin * cfg.horizon * interiorSurvival -
            cfg.deathCost * (1 - interiorSurvival) -
            cfg.interiorDamage / Math.max(1, basePlayer.hp) *
              100 * cfg.riskWeight;
          interiorSamples.push({
            ev: interiorEv,
            enemyHp: interiorEnemyMetrics.hp,
            enemyDps: interiorEnemyMetrics.dps,
            playerHp: basePlayer.hp,
            playerDps: basePlayer.dps,
            coins: 0,
            damage: cfg.interiorDamage,
            survival: interiorSurvival,
            enemyHpDelta: (interiorEnemyMetrics.hp / baseEnemy.hp - 1) * 100,
            enemyDpsDelta: (interiorEnemyMetrics.dps / baseEnemy.dps - 1) * 100,
            playerHpDelta: 0,
            playerDpsDelta: 0,
            marginDelta: interiorMargin
          });
        }
        return {
          arena: summarize(arenaSamples),
          interior: summarize(interiorSamples)
        };
      }

      function pct(value, digits = 1) {
        const prefix = value &gt; 0.045 ? &#x27;+&#x27; : &#x27;&#x27;;
        return prefix + value.toFixed(digits) + &#x27;%&#x27;;
      }

      function points(value, digits = 1) {
        const prefix = value &gt; 0.045 ? &#x27;+&#x27; : &#x27;&#x27;;
        return prefix + value.toFixed(digits);
      }

      function number(value, digits = 2) {
        return value.toFixed(digits);
      }

      function recommendationCards(results) {
        const container = byId(&#x27;rbl-recommendations&#x27;);
        container.replaceChildren();
        results.forEach((result, index) =&gt; {
          const winner = result.arena.ev &gt;= result.interior.ev ? &#x27;Arena&#x27; : &#x27;Enemy interior&#x27;;
          const edge = Math.abs(result.arena.ev - result.interior.ev);
          const card = document.createElement(&#x27;div&#x27;);
          card.className = &#x27;card viz-stat&#x27;;
          const label = document.createElement(&#x27;div&#x27;);
          label.className = &#x27;text-muted&#x27;;
          label.textContent = phaseNames[index];
          const main = document.createElement(&#x27;div&#x27;);
          main.className = &#x27;viz-stat-value&#x27;;
          main.textContent = winner;
          const detail = document.createElement(&#x27;div&#x27;);
          detail.className = &#x27;text-small&#x27;;
          detail.textContent = edge.toFixed(1) + &#x27; EV-point edge&#x27;;
          card.append(label, main, detail);
          container.append(card);
        });
      }

      function drawChart(results) {
        const svg = byId(&#x27;rbl-chart&#x27;);
        Array.from(svg.children).forEach(child =&gt; {
          if (![&#x27;title&#x27;, &#x27;desc&#x27;].includes(child.tagName.toLowerCase())) child.remove();
        });
        const all = [];
        results.forEach(result =&gt; {
          [&#x27;arena&#x27;, &#x27;interior&#x27;].forEach(choice =&gt; {
            all.push(Math.abs(result[choice].evP10), Math.abs(result[choice].evP90));
          });
        });
        const extent = Math.max(20, Math.ceil(Math.max(...all) / 10) * 10);
        const left = 148;
        const right = 45;
        const top = 34;
        const bottom = 30;
        const width = 720 - left - right;
        const height = 292 - top - bottom;
        const x = value =&gt; left + (value + extent) / (extent * 2) * width;
        const ns = &#x27;http://www.w3.org/2000/svg&#x27;;
        function element(name, attrs, text) {
          const node = document.createElementNS(ns, name);
          Object.entries(attrs || {}).forEach(([key, val]) =&gt; node.setAttribute(key, val));
          if (text !== undefined) node.textContent = text;

        }
        [-1, -0.5, 0, 0.5, 1].forEach(factor =&gt; {

          element(&#x27;line&#x27;, {

      function renderTable(results) {

              number(summary.coins, 1),

          [&#x27;rbl-horizon&#x27;, &#x27;rbl-horizon-value&#x27;, value =&gt; value + (value === 1 ? &#x27; fight&#x27; : &#x27; fights&#x27;)],
          [&#x27;rbl-risk-weight&#x27;, &#x27;rbl-risk-weight-value&#x27;, value =&gt; value + &#x27;%&#x27;],
          [&#x27;rbl-death-cost&#x27;, &#x27;rbl-death-cost-value&#x27;, value =&gt; value + &#x27; EV&#x27;],

          [&#x27;rbl-early-enemy&#x27;, &#x27;rbl-early-enemy-value&#x27;, String],

          [&#x27;rbl-early-internals&#x27;, &#x27;rbl-early-internals-value&#x27;, String],
          [&#x27;rbl-mid-enemy&#x27;, &#x27;rbl-mid-enemy-value&#x27;, String],
          [&#x27;rbl-mid-player&#x27;, &#x27;rbl-mid-player-value&#x27;, String],
          [&#x27;rbl-mid-internals&#x27;, &#x27;rbl-mid-internals-value&#x27;, String],
          [&#x27;rbl-late-enemy&#x27;, &#x27;rbl-late-enemy-value&#x27;, String],
          [&#x27;rbl-late-player&#x27;, &#x27;rbl-late-player-value&#x27;, String],
          [&#x27;rbl-late-internals&#x27;, &#x27;rbl-late-internals-value&#x27;, String],
          [&#x27;rbl-contact-rate&#x27;, &#x27;rbl-contact-rate-value&#x27;, value =&gt; Number(value).toFixed(2) + &#x27;/s&#x27;],
          [&#x27;rbl-charger-accuracy&#x27;, &#x27;rbl-charger-accuracy-value&#x27;, value =&gt; value + &#x27;%&#x27;],
          [&#x27;rbl-shooter-accuracy&#x27;, &#x27;rbl-shooter-accuracy-value&#x27;, value =&gt; value + &#x27;%&#x27;],

          [&#x27;rbl-aim&#x27;, &#x27;rbl-aim-value&#x27;, value =&gt; value + &#x27;%&#x27;],

          [&#x27;rbl-bursts&#x27;, &#x27;rbl-bursts-value&#x27;, value =&gt; Number(value).toFixed(2)],
          [&#x27;rbl-uptime&#x27;, &#x27;rbl-uptime-value&#x27;, value =&gt; value + &#x27;%&#x27;],
          [&#x27;rbl-exposure&#x27;, &#x27;rbl-exposure-value&#x27;, value =&gt; value + &#x27;%&#x27;]

        labels.forEach(([input, output, format]) =&gt; {

      function run() {
        const cfg = config();
        const started = performance.now();
        byId(&#x27;rbl-run&#x27;).disabled = true;
        byId(&#x27;rbl-status&#x27;).textContent = &#x27;Simulating…&#x27;;
        window.setTimeout(() =&gt; {
          seedCounter += 7919;

            simulatePhase(index, cfg, seedCounter + index * 104729));
          recommendationCards(results);

      root.querySelectorAll(&#x27;input[type=&quot;range&quot;]&#x27;).forEach(input =&gt; {
        input.addEventListener(&#x27;input&#x27;, updateLabels);

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
